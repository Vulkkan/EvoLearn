{% extends "base.html" %}

{% block title %}EvoLearn{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ request.url_for('static', path='styles/upload_style.css') }}">
{% endblock %}

{% block content %}

    <main>
        <div class="container">
            <h4>Upload a PDF to Summarize</h4>

            <form id="uploadForm" action="/generate_summary" method="post" enctype="multipart/form-data">
                    <div class="cardupload">
                        <h3>Summarizer</h3>

                        <div class="drop_box">
                            <h4>Select (PDF) File here</h4>

                            <input type="file" name="pdf_file" accept=".pdf" id="fileID" required>
                        </div>

                        <div class="ans-btn-container">
                            <button class="btnAux" type="submit">Upload</button>
                        </div>
                    </div>
            </form>
            
        </div>
        <div class="loader-container" id="loaderContainer">
            <div class="loader"></div>
        </div>
    </main>
{% endblock %}
