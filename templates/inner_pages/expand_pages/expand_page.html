<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="{{ request.url_for('static', path='styles/index3.css') }}" rel="stylesheet" type="text/css" />

    <link rel="stylesheet" href="{{ request.url_for('static', path='styles/quiz/upload_style.css') }}">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expand - Upload PDF</title>
</head>

<body>
    <!-- Header -->
    <header class="header sticky-top">
        <div class="logo">
        <img src="{{ request.url_for('static', path='images/quiz/bell.svg') }}" alt="Logo" class="logo-img" />
    </div>
    <ul class="nav">
        <li><a href="#">Dashboard</a></li>
        <li><a href="#">Class Room</a></li>
        <li><a href="#">Class Schedule</a></li>
    </ul>
    <div class="icons">
        <img src="{{ request.url_for('static', path='images/quiz/user.svg') }}" alt="Logo" class="icon" />
        <img src="{{ request.url_for('static', path='images/quiz/bell2.svg') }}" alt="Logo" class="icon" />
        <p class="role">Student</p>
    </div>
    </header>
    
    <main>
        <div class="container">
            <h4>Upload a PDF to get more knowledge on it</h4>

            <form action="{{ request.url_for('generate_more') }}" method="post" enctype="multipart/form-data">
                    <div class="cardupload">
                        <h3>Smart Enhance</h3>

                        <div class="drop_box">
                            <h4>Select (PDF) File here</h4>

                            <input type="file" name="file" accept=".pdf" required>
                        </div>

                        <div class="ans-btn-container">
                            <button class="answer-btn" type="submit">Upload</button>
                        </div>
                    </div>
            </form>
            
        </div>
        <div class="loader-container" id="loaderContainer">
            <div class="loader"></div>
        </div>
    </main>
    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent form submission
            document.getElementById('loaderContainer').style.display = 'flex';
            
            // Simulate form submission (replace with actual form submission logic)
            setTimeout(function() {
                document.getElementById('uploadForm').submit(); // Submit the form after showing loader
            }, 1000); // Simulate 1 second delay, replace with actual AJAX or server-side logic
        });
    </script>
</body>
</html>
