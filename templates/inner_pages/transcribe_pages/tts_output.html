<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audio Result</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="{{ request.url_for('static', path='styles/index3.css') }}" rel="stylesheet" type="text/css" />

    <style>
        .audio-container {
            align-items: center;
            justify-content: center;
            max-width: 600px;
            margin: auto;
            text-align: center;
        }
        audio {
            width: 100%;
            margin: 20px 0;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
        }
        .buttons button {
            background-color: #1976D2;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .buttons button:hover {
            background-color: #155a9c;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header sticky-top">
        <div class="logo">
            <img src="{{ request.url_for('static', path='images/quiz/bell.svg') }}" alt="Logo" class="logo-img" />
        </div>
        <ul class="nav">
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Class Room</a></li>
            <li><a href="#">Class Schedule</a></li>
        </ul>
        <div class="icons">
            <img src="{{ request.url_for('static', path='images/quiz/user.svg') }}" alt="Logo" class="icon" />
            <img src="{{ request.url_for('static', path='images/quiz/bell2.svg') }}" alt="Logo" class="icon" />
            <p class="role">Student</p>
        </div>
        </header>

    <div class="audio-container">
        <h4 style="margin-top: 80px;">Your Audio Note is Ready</h4>
        
        <audio controls>
            <source src="{{ request.url_for('static', path='audio_output/' + audio_filename) }}" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

        <div class="buttons">
            <a href="{{ request.url_for('uni_dash') }}">
                <button>Return to Dashboard</button>
            </a>

            <a href="{{ request.url_for('static', path='audio_output/' + audio_filename) }}" download style="text-decoration: none;">
                <div style="background-color:#1976D2; color:white; padding:12px 24px; border-radius:8px; display:inline-block;">
                    Download Audio
                </div>
            </a>            
        </div>
    </div>

</body>
</html>
