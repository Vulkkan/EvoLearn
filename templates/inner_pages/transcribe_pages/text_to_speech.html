{% extends "base.html" %}

{% block title %}Intelleqt AI{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ request.url_for('static', path='styles/upload_style.css') }}">
{% endblock %}

{% block content %}
    <main>
        <div class="container">
            <h4>Upload an PDF to generate audio note</h4>

            <form id="uploadForm" action="/generate_audio" method="post" enctype="multipart/form-data">
                    <div class="cardupload">
                        <h3>Audio Note</h3>

                        <div class="drop_box">
                            <h4>Select PDF file here</h4>

                            <input type="file" name="file" accept=".pdf" id="fileID" required>
                        </div>

                        <div class="ans-btn-container">
                            <button class="btnAux" type="submit">Upload</button>
                        </div>
                    </div>
            </form>
            
        </div>
        <div class="loader-container" id="loaderContainer">
            <div class="loader"></div>
        </div>
    </main>
    <script>
        document.getElementById('uploadForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent form submission
            document.getElementById('loaderContainer').style.display = 'flex';
            
            // Simulate form submission (replace with actual form submission logic)
            setTimeout(function() {
                document.getElementById('uploadForm').submit(); // Submit the form after showing loader
            }, 1000); // Simulate 1 second delay, replace with actual AJAX or server-side logic
        });
    </script>
{% endblock %}
